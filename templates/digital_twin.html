{% extends "base.html" %}
{% block title %}3D Digital Twin - Chennai Smart City{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h2 class="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-cubes text-sky-600"></i> 3D Digital Twin Map
        </h2>
    </div>

    <div class="bg-white p-2 rounded-2xl border border-gray-200 shadow-sm">
        <div id="twin-map" class="h-[520px] w-full rounded-xl"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const map = L.map('twin-map').setView([13.0827, 80.2707], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
</script>
{% endblock %}
