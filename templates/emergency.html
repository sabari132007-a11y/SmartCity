{% extends "base.html" %}
{% block title %}Emergency Services - Chennai Smart City{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <h2 class="text-2xl font-extrabold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-truck-medical text-red-600"></i> Emergency Helplines
        </h2>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-red-50 p-4 rounded-xl border border-red-200 text-center">
            <div class="text-2xl font-extrabold text-red-600">1913</div>
            <div class="text-xs text-gray-600 mt-1">GCC Civic Helpline</div>
        </div>
        <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center">
            <div class="text-2xl font-extrabold text-blue-600">100 / 112</div>
            <div class="text-xs text-gray-600 mt-1">Police</div>
        </div>
        <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-center">
            <div class="text-2xl font-extrabold text-emerald-600">108</div>
            <div class="text-xs text-gray-600 mt-1">Ambulance</div>
        </div>
        <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 text-center">
            <div class="text-2xl font-extrabold text-amber-600">101</div>
            <div class="text-xs text-gray-600 mt-1">Fire Service</div>
        </div>
    </div>
</div>
{% endblock %}
